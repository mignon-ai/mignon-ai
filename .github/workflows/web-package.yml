name: Publish web package

# Tests the WebAssembly package on every change to it. Pushing a tag vX.Y.Z publishes
# @mignon-ai/mignon-web to npm and keeps the files for a CDN as a build artifact.
on:
  push:
    tags: ["v*"]
  pull_request:
    paths: ["packages/mignon-web/**", "cmd/mignon-web/**", "pkg/**", "internal/**", ".github/workflows/web-package.yml"]

permissions:
  contents: read
  id-token: write   # npm provenance

jobs:
  package:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/mignon-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: The tag must match the package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: test "v$(node -p "require('./package.json').version")" = "${GITHUB_REF_NAME}"
      - name: Build and test
        run: npm test
      - name: Tarball
        run: npm run pack:tarball
      - name: Files for a CDN
        uses: actions/upload-artifact@v4
        with:
          name: mignon-web-cdn
          path: |
            packages/mignon-web/dist/mignon.js
            packages/mignon-web/dist/mignon.mjs
            packages/mignon-web/dist/mignon-web.wasm
            packages/mignon-web/dist/integrity.json
            packages/mignon-web/dist/NOTICE
            packages/mignon-web/*.tgz
      - name: Publish to npm
        if: startsWith(github.ref, 'refs/tags/v')
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
