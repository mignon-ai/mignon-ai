name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]   # amd64 (AVX2 kernels) and arm64 (portable Go fallbacks)
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...
      - name: WebAssembly build
        if: matrix.os == 'ubuntu-latest'
        run: GOOS=js GOARCH=wasm go build -o /dev/null ./cmd/mignon-web
      - name: Formatting
        if: matrix.os == 'ubuntu-latest'
        run: test -z "$(gofmt -l .)"
